<!DOCTYPE html><html lang="en" ng-app="franchiseApp"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Sign In - FranchiseEdge</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script><script src="app-core.js"></script></head><body class="auth-body" ng-controller="AdminLoginController"><div class="auth-left"><div class="logo">FranchiseEdge</div><h1 style="font-size:2.5rem;line-height:1.2;margin:30px 0 20px;">System administration.</h1><p>Secure access for the FranchiseEdge platform administrator.</p></div><div class="auth-right"><div class="auth-card"><h2>Admin Sign In</h2><p>Use your administrator credentials.</p><div class="error-text" ng-if="loginError">{{loginError}}</div><form ng-submit="login()"><div class="form-group"><label>Email</label><input type="email" ng-model="credentials.email" required></div><div class="form-group"><label>Password</label><input type="password" ng-model="credentials.password" required></div><button class="btn full" type="submit"><i class="fa-solid fa-shield-halved"></i> Sign In as Admin</button></form><div class="link-text"><a href="login.html">Company sign in</a> &bull; <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a></div></div></div></body></html>
